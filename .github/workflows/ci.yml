name: Python tests and browser checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest httpx build
      - name: Verify environment and package build
        run: |
          python -m pip check
          python -m compileall -q agents surgical_site_infection_agent cli.py ssi_sentinel.py enrichment.py
          python -m build --wheel --outdir /tmp/ssi-dist
      - name: Python regression suite
        run: python -m pytest -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse browser scripts
        run: |
          node --check web/engine.js
          node --check web/app.js
      - name: Verify demonstration rules
        run: node --test tests/test_web_engine.cjs
