[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surgical-site-infection-engine"
version = "2.0.0"
description = "SSI-Sentinel: Post-Operative Wound Surveillance & CDC NHSN Staging Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
surgical-site-infection-engine = "surgical_site_infection_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/surgical-site-infection-engine"
Repository = "https://github.com/abusuraihsakhri/surgical-site-infection-engine.git"
