[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surgical-site-infection-engine"
version = "2.0.0"
description = "Synthetic demonstration of SSI-related audit workflows and generic thresholds"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
surgical-site-infection-engine = "surgical_site_infection_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/surgical-site-infection-agent"
Repository = "https://github.com/abusuraihsakhri/surgical-site-infection-agent.git"
\n[tool.setuptools.packages.find]\ninclude = ["agents*", "surgical_site_infection_agent*"]\n